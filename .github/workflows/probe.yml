name: Third-party Probe

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube URL for probe'
        default: 'https://www.youtube.com/watch?v=bajG5ZDyydI'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright + Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run third-party probe
        env:
          YT_URL: ${{ inputs.video_url }}
        run: node scripts/probe_thirdparty.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: |
            probe_results.json
            probe_*.png
          if-no-files-found: warn
