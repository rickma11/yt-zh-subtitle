name: Pixeldrain re-upload (today's video)
on:
  workflow_dispatch:
    inputs:
      asset_url:
        description: 'Release asset (1080p lite) 下载 URL'
        required: true
      out_name:
        description: '上传到 Pixeldrain 的文件名'
        required: true

jobs:
  reup:
    runs-on: ubuntu-latest
    outputs:
      pixel_link: ${{ steps.up.outputs.PIXEL_LINK }}
    steps:
      - name: 下载视频并上传 Pixeldrain
        id: up
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          if [ -z "$PIXELDRAIN_API_KEY" ]; then echo "Secret 未配置"; exit 1; fi
          URL="${{ github.event.inputs.asset_url }}"
          NAME="${{ github.event.inputs.out_name }}"
          echo "下载 $URL -> $NAME"
          curl -L --max-time 1200 -o "$NAME" "$URL"
          ls -la "$NAME"
          RESP=$(curl -s --max-time 1200 -u ":${PIXELDRAIN_API_KEY}" -F "file=@${NAME}" "https://pixeldrain.com/api/file")
          echo "resp: $RESP"
          ID=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          if [ -n "$ID" ]; then
            echo "PIXEL_LINK=https://pixeldrain.com/u/$ID" >> "$GITHUB_OUTPUT"
            echo "OK 直链: https://pixeldrain.com/u/$ID"
          else
            echo "FAILED 上传被拒"; exit 1
          fi
