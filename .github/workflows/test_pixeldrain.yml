name: Pixeldrain smoke test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 上传小文件验证 API Key 认证（邮箱已激活）
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          if [ -z "$PIXELDRAIN_API_KEY" ]; then echo "Secret 未配置"; exit 1; fi
          echo "pixeldrain auth smoke test $(date -u +%FT%TZ)" > t.txt
          RESP=$(curl -s --max-time 60 -u ":${PIXELDRAIN_API_KEY}" -F "file=@t.txt" "https://pixeldrain.com/api/file")
          echo "resp: $RESP"
          ID=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          if [ -n "$ID" ]; then
            echo "OK 直链: https://pixeldrain.com/u/$ID"
          else
            echo "FAILED 认证上传仍被拒"
            exit 1
          fi
