name: yt-zh-subtitle

on:
  schedule:
    # UTC 19/20/21/22 点整 = 北京时间 03:00-05:00，每小时检查一次频道更新
    - cron: "0 19-22 * * *"
  workflow_dispatch:
    inputs:
      video_url:
        description: "可选：直接处理指定 YouTube 视频（留空则走频道监控逻辑）"
        required: false
        default: ""

concurrency:
  group: yt-zh-subtitle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps (ffmpeg + CJK fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Patch faster-whisper for PyAV compat (if needed)
        run: |
          python - <<'EOF'
          import pathlib, faster_whisper
          p = pathlib.Path(faster_whisper.__file__).parent / "audio.py"
          s = p.read_text(encoding="utf-8")
          s2 = s.replace(', metadata_errors="ignore"', '').replace(", metadata_errors='ignore'", '')
          if s != s2:
              p.write_text(s2, encoding="utf-8")
              print("patched faster_whisper/audio.py (removed metadata_errors)")
          else:
              print("no patch needed")
          EOF

      - name: Start bgutil PO token provider
        run: |
          git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider /tmp/bgutil
          cd /tmp/bgutil/server
          npm ci --silent
          npm run build --silent
          nohup node build/main.js --port 4416 > /tmp/bgutil.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:4416/get_pot > /dev/null 2>&1 && break
            sleep 2
          done
          echo "--- POT probe ---"
          curl -s --max-time 20 http://127.0.0.1:4416/get_pot | head -c 300
          echo

      - name: Monitor channels
        id: monitor
        run: python monitor.py

      - name: Process videos
        id: batch
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          PO_TOKEN_URL: http://127.0.0.1:4416/get_pot
        run: python run_batch.py

      - name: Commit state
        run: |
          git config user.name "yt-zh-bot"
          git config user.email "yt-zh-bot@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "state 无变化，跳过提交"
          else
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase -q && git push -q && break
              echo "push 重试 $i"; sleep 3
            done
          fi
