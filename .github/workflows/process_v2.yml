name: Process Video v2 (notube + downsub + 烧录 + Release)

on:
  # 定时触发已迁移到外部 cron-job.org（GitHub 自带 schedule 会延迟，实测拖到 07:12）。
  # cron-job.org 用 POST 调用本 workflow 的 workflow_dispatch 接口；此处保留 manual 触发入口。
  workflow_dispatch:
    inputs:
      video_id:
        description: '可选：直接处理指定 YouTube 视频 ID（留空则走频道监控）'
        required: false
        default: ''

# 关键：gh release create 需要 contents:write；上传/下载跨 run 续传产物需要 actions:write
permissions:
  contents: write
  actions: write

concurrency:
  group: yt-zh-process
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      PAN123_CLIENT_ID: ${{ secrets.PAN123_CLIENT_ID }}
      PAN123_CLIENT_SECRET: ${{ secrets.PAN123_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + CJK font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - name: Setup Node + Playwright
        run: |
          npm install playwright@1.57.0 --no-save
          npx playwright install chromium --with-deps

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: python -m pip install --quiet faster-whisper requests

      - name: Patch faster-whisper/PyAV 兼容 (移除 av.open 的 metadata_errors 参数)
        run: |
          python - <<'PY'
          import pathlib, faster_whisper
          p = pathlib.Path(faster_whisper.__file__).parent / "audio.py"
          t = p.read_text(encoding="utf-8")
          if "metadata_errors" in t:
              t = t.replace(', metadata_errors="ignore"', '').replace(", metadata_errors='ignore'", '')
              p.write_text(t, encoding="utf-8")
              print("patched audio.py @", p)
          else:
              print("no metadata_errors kwarg, skip")
          PY

      - name: Resolve video_id (监控 or 手动)
        id: resolve
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "${{ inputs.video_id }}" ]; then
            echo "vid=${{ inputs.video_id }}" >> "$GITHUB_OUTPUT"
            echo "手动指定视频: ${{ inputs.video_id }}"
          else
            python monitor.py
            VID=$(python -c "import json;d=json.load(open('new_videos.json'));print(d[0]['video_id'] if d else '')" 2>/dev/null || true)
            echo "监控到最新未处理视频: ${VID:-（无）}"
            echo "vid=$VID" >> "$GITHUB_OUTPUT"
          fi

      # 注：跨 run 续传（gh artifact 命令不存在）已移除，生产低频重下不影响；产物用标准 action 留存便于排查
      - name: Step1 下载视频 (notube)
        if: steps.resolve.outputs.vid != ''
        env:
          VID: ${{ steps.resolve.outputs.vid }}
          OUTDIR: work
        run: node scripts/notube_prod.mjs

      - name: 上传视频产物 (调试/留存)
        if: steps.resolve.outputs.vid != ''
        uses: actions/upload-artifact@v4
        with:
          name: yt-video-${{ steps.resolve.outputs.vid }}
          path: work/video.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Step2a 获取字幕 (DownSub API 首选)
        id: downsub
        if: steps.resolve.outputs.vid != ''
        continue-on-error: true
        env:
          VID: ${{ steps.resolve.outputs.vid }}
          OUTDIR: work
          DOWNSUB_API_KEY: ${{ secrets.DOWNSUB_API_KEY }}
        run: python scripts/downsub_api.py

      - name: Step2b 获取字幕 (Whisper 兜底)
        if: steps.resolve.outputs.vid != '' && steps.downsub.outcome != 'success'
        env:
          VID: ${{ steps.resolve.outputs.vid }}
          OUTDIR: work
          WHISPER_MODEL: small
        run: python scripts/whisper_subs.py

      - name: 上传字幕产物 (调试/留存)
        if: steps.resolve.outputs.vid != ''
        uses: actions/upload-artifact@v4
        with:
          name: yt-subs-${{ steps.resolve.outputs.vid }}
          path: |
            work/zh.srt
            work/en.srt
            work/subs_meta.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Step3 翻译润色 + 烧录（完整版 + 1080p 精简版）
        if: steps.resolve.outputs.vid != ''
        env:
          OUTDIR: work
          PYTHONUTF8: '1'
        run: python scripts/finalize.py

      - name: Step3.5 获取视频封面 (thumbnail)
        id: cover
        if: steps.resolve.outputs.vid != ''
        env:
          VID: ${{ steps.resolve.outputs.vid }}
        run: |
          mkdir -p work
          COVER_URL=""
          for NAME in maxresdefault sddefault hqdefault; do
            U="https://i.ytimg.com/vi/${VID}/${NAME}.jpg"
            if curl -fsSL --max-time 30 -o "work/_cover_try.jpg" "$U"; then
              # 校验 JPEG magic bytes（ff d8），排除 maxres 缺失时的 404/占位图
              if [ "$(head -c 2 work/_cover_try.jpg | od -An -tx1 | tr -d ' \n')" = "ffd8" ]; then
                mv work/_cover_try.jpg work/cover.jpg
                COVER_URL="$U"
                echo "封面 OK: $U"
                break
              fi
            fi
            rm -f work/_cover_try.jpg
          done
          if [ -z "$COVER_URL" ]; then
            echo "WARN 未取到有效封面，回退 hqdefault 链接"
            COVER_URL="https://i.ytimg.com/vi/${VID}/hqdefault.jpg"
          fi
          echo "url=$COVER_URL" >> "$GITHUB_OUTPUT"

      - name: Step3.8 中文占比校验门（防止静默出英文片）
        if: steps.resolve.outputs.vid != ''
        run: |
          python - <<'PY'
          import re, sys
          p = "work/zh.srt"
          try:
              txt = open(p, encoding="utf-8", errors="ignore").read()
          except FileNotFoundError:
              print("FATAL 无 zh.srt"); sys.exit(1)
          HAN = re.compile(r'[\u4e00-\u9fff]')
          LAT = re.compile(r'[A-Za-z]')
          # 仅统计字幕正文行（排除序号行与 --> 时间轴行）
          lines = [l.strip() for l in txt.splitlines()
                   if l.strip() and '-->' not in l and not l.strip().isdigit()]
          if not lines:
              print("FATAL zh.srt 为空"); sys.exit(1)
          eng = sum(1 for l in lines if LAT.search(l) and not HAN.search(l))
          ratio = eng / len(lines)
          print(f"字幕 {len(lines)} 行，仍英文 {eng} 行（占比 {ratio:.0%}）")
          if ratio >= 0.6:
              print(f"FATAL 中文占比不足（英文占比 {ratio:.0%} >= 60%），"
                    f"job 失败以便下次 cron 重跑，不静默出英文片")
              sys.exit(1)
          print("中文校验通过")
          PY

      - name: Step4 发布 Release（完整版 + 1080p精简版 + 字幕 + 封面）
        id: release
        if: steps.resolve.outputs.vid != ''
        run: |
          TITLE=$(python -c "import json;print(json.load(open('work/notube_meta.json')).get('title','video'))" 2>/dev/null || echo "video")
          SAFE=$(python - <<'PY'
          import json,re
          try: t=json.load(open('work/notube_meta.json')).get('title','video')
          except: t='video'
          # 白名单清洗：仅保留 中英日韩文字/字母/数字/下划线 + 少量标题常用符号(+ - ! & . , ' ( ) [ ])，
          # 其余(emoji如🔥🤯、箭头、变体选择符等非常规字符)一律剔除，避免文件名/路径出问题
          t=re.sub(r"[^\w\s+\-!&.,'()\[\]%]",'',t)
          t=re.sub(r'\s+','_',t)
          print(t[:60])
          PY
          )
          DATE=$(date +%Y%m%d)
          NAME_FULL="${DATE}_${SAFE}.mp4"
          NAME_COMPACT="${DATE}_${SAFE}_1080p.mp4"
          mv work/output.mp4 "$NAME_FULL"
          if [ -f work/output_1080p.mp4 ]; then
            mv work/output_1080p.mp4 "$NAME_COMPACT"
          else
            NAME_COMPACT="$NAME_FULL"
            echo "WARN 无 1080p精简版，手机版回退为完整版"
          fi
          TAG="auto-${DATE}-${VIDEO_ID}"
          COVER_ARG=""
          if [ -f work/cover.jpg ]; then COVER_ARG="work/cover.jpg"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过创建"
          else
            # 无 || true：真实失败（如文件缺失/权限）必须让 run 报错可见
            gh release create "$TAG" "$NAME_FULL" "$NAME_COMPACT" work/zh.srt $COVER_ARG \
              --title "$TITLE" \
              --notes "自动处理：notube 下载 + DownSub/Whisper 字幕 + Google 翻译硬烧录（含完整版、1080p精简版与封面）"
          fi
          echo "name_full=$NAME_FULL" >> "$GITHUB_OUTPUT"
          echo "name_compact=$NAME_COMPACT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_url=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO_ID: ${{ steps.resolve.outputs.vid }}

      - name: Step4b 上传 Pixeldrain 免费网盘（直链，可选账号 API Key 认证）
        id: pixeldrain
        if: steps.resolve.outputs.vid != ''
        continue-on-error: true
        env:
          NAME_COMPACT: ${{ steps.release.outputs.name_compact }}
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          F="$NAME_COMPACT"
          echo "上传 $F 到 Pixeldrain ..."
          AUTH=""
          if [ -n "$PIXELDRAIN_API_KEY" ]; then
            AUTH="-u :${PIXELDRAIN_API_KEY}"
            echo "使用账号 API Key 认证上传（文件归属你的 Pixeldrain 账号，可管理/防过期）"
          else
            echo "匿名上传（无需账号，30天无下载自动清理）"
          fi
          RESP=$(curl -s --max-time 900 $AUTH -F "file=@${F}" "https://pixeldrain.com/api/file")
          echo "resp: ${RESP:0:200}"
          ID=$(echo "$RESP" | python -c "import sys,json
          try:
              d=json.load(sys.stdin); print(d.get('id',''))
          except Exception: print('')" 2>/dev/null)
          if [ -n "$ID" ]; then
            # 直链下载（点开即下载，无需经过分享页）：https://pixeldrain.com/api/file/<ID>?download
            echo "url=https://pixeldrain.com/api/file/${ID}?download" >> "$GITHUB_OUTPUT"
            echo "OK pixeldrain: $ID"
          else
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "WARN pixeldrain 上传失败"
          fi

      - name: Step4c 上传 123云盘（国内网盘，可选，需配置 Secrets）
        id: pan123
        if: steps.resolve.outputs.vid != '' && env.PAN123_CLIENT_ID != '' && env.PAN123_CLIENT_SECRET != ''
        continue-on-error: true
        env:
          NAME_COMPACT: ${{ steps.release.outputs.name_compact }}
          PAN123_CLIENT_ID: ${{ secrets.PAN123_CLIENT_ID }}
          PAN123_CLIENT_SECRET: ${{ secrets.PAN123_CLIENT_SECRET }}
        run: |
          python -m pip install --quiet pan123
          URL=$(python scripts/pan123_upload.py "$NAME_COMPACT")
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "pan123 url: ${URL:-（空，上传/分享失败）}"

      - name: Step4d 推送 Server酱（聚合各下载直链）
        if: steps.resolve.outputs.vid != ''
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          NAME_COMPACT: ${{ steps.release.outputs.name_compact }}
          PIXEL_URL: ${{ steps.pixeldrain.outputs.url }}
          PAN123_URL: ${{ steps.pan123.outputs.url }}
          VIDEO_ID: ${{ steps.resolve.outputs.vid }}
          COVER_URL: ${{ steps.cover.outputs.url }}
        run: |
          if [ -z "$SERVERCHAN_KEY" ]; then echo "no SERVERCHAN_KEY, skip"; exit 0; fi
          TITLE=$(python -c "import json;print(json.load(open('work/notube_meta.json')).get('title','video'))" 2>/dev/null || echo "video")
          # 视频标题中文翻译（原文英文 + 中文，便于一眼分辨内容）
          ZH_TITLE=$(python - <<'PY'
          import json
          try:
              from translate import translate
              t = json.load(open('work/notube_meta.json')).get('title', '')
              print(translate(t) if t else '')
          except Exception:
              print('')
          PY
          )
          # 中文标题与英文原标题一样始终展示（用户要求：通知必须同时含英文原标题 + 中文翻译）。
          # 三端全挂时 translate() 会退回原文；原文无可译内容（如 "100%"）时译文与原文相同；
          # 两种情况都照实展示，不静默缺行。极端情况（python 块整体异常）用 TITLE 兜底。
          if [ -z "$ZH_TITLE" ] && [ -n "$TITLE" ]; then ZH_TITLE="$TITLE"; fi
          LINKS=""
          if [ -n "$COVER_URL" ]; then
            LINKS="${LINKS}%0A🖼️ 封面图: ${COVER_URL}"
            LINKS="${LINKS}%0A![封面](${COVER_URL})"
          fi
          if [ -n "$PIXEL_URL" ]; then LINKS="${LINKS}%0A📦 免费网盘直链(需VPN/代理, 点开直接下载): ${PIXEL_URL}"; fi
          if [ -n "$PAN123_URL" ]; then LINKS="${LINKS}%0A📦 国内网盘(123云盘): ${PAN123_URL}"; fi
          LINKS="${LINKS}%0A📦 GitHub Release(完整版+1080p精简版+封面): ${RELEASE_URL}"
          LINKS="${LINKS}%0A📄 字幕 zh.srt 见上述 Release 资产"
          # 标题行：原文英文 + 中文翻译（用户要求）
          TITLE_LINE="🎬 标题（原文）: ${TITLE}"
          if [ -n "$ZH_TITLE" ]; then TITLE_LINE="${TITLE_LINE}%0A🎬 标题（中文）: ${ZH_TITLE}"; fi
          curl -s "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send" \
            -d "title=新视频处理完成（已烧录中文字幕）" \
            -d "desp=${TITLE_LINE}${LINKS}" || true

      - name: 标记已处理并提交 state.json
        # 仅当发布真正成功(Step4 release outcome=success)才写维护表，
        # 避免 Step3.8 校验门失败/发布失败时仍写入 video_log 导致该视频永远被去重、漏抓
        if: steps.release.outcome == 'success'
        env:
          VID: ${{ steps.resolve.outputs.vid }}
        run: |
          python - <<'PY'
          import json,os,datetime
          vid = os.environ['VID']
          # state.json（兼容保留 processed 标记）
          p='state.json'
          try: s=json.load(open(p))
          except Exception: s={}
          s.setdefault('processed',{})[vid]='done'
          json.dump(s,open(p,'w'),ensure_ascii=False,indent=2)
          # video_log.json 维护表：视频id -> {date, title, channel}
          # 只记录“最新且首次出现”的视频，持续累积，用于后续去重。
          lp='video_log.json'
          try: v=json.load(open(lp))
          except Exception: v={}
          title=''
          cid=''
          try:
              nv=json.load(open('new_videos.json'))
              if nv:
                  title=nv[0].get('title','')
                  cid=nv[0].get('channel_id','')
          except Exception:
              pass
          bj=datetime.timezone(datetime.timedelta(hours=8))
          today=datetime.datetime.now(bj).strftime('%Y-%m-%d')
          v[vid]={'date':today,'title':title,'channel':cid}
          json.dump(v,open(lp,'w'),ensure_ascii=False,indent=2)
          print('video_log updated:',vid,today,title[:40])
          PY
          git config user.name "yt-zh-bot"
          git config user.email "yt-zh-bot@users.noreply.github.com"
          git add state.json video_log.json
          if git diff --staged --quiet; then
            echo "state 无变化，跳过提交"
          else
            git commit -m "state+video_log: processed $VID"
            # 直接推到 main（维护表仅 bot 写；每个 run 基于最新 main checkout，通常 fast-forward）。
            # 旧写法 git pull --rebase 在 Actions 默认 detached HEAD 下必失败 → 永远推不上云 →
            # 维护表从未持久化（这就是 video_log.json 一直是空 {} 的根因）。
            for i in 1 2 3; do
              git push origin HEAD:refs/heads/main -q && break
              echo "push 重试 $i"; sleep 3
              git fetch origin main -q 2>/dev/null || true
            done
          fi
