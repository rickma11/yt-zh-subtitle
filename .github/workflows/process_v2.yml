name: Process Video v2 (notube + downsub)
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'YouTube video ID'
        required: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + CJK font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - name: Setup Node + Playwright
        run: |
          npm install playwright@1.57.0 --no-save
          npx playwright install chromium --with-deps

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: python -m pip install --quiet requests

      - name: Step1 下载视频 (notube)
        env:
          VID: ${{ inputs.video_id }}
          OUTDIR: work
        run: node scripts/notube_prod.mjs

      - name: Step2 获取字幕 (downsub)
        env:
          VID: ${{ inputs.video_id }}
          OUTDIR: work
        run: node scripts/downsub_prod.mjs

      - name: Step3 翻译润色 + 烧录
        env:
          OUTDIR: work
          PYTHONUTF8: '1'
        run: python scripts/finalize.py

      - name: Step4 发布 Release + 推送
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIDEO_ID: ${{ inputs.video_id }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          TITLE=$(python -c "import json;print(json.load(open('work/notube_meta.json')).get('title','video'))" 2>/dev/null || echo "video")
          SAFE=$(echo "$TITLE" | sed 's/[\/\\:"*?<>|]//g; s/[[:space:]]/_/g' | cut -c1-60)
          DATE=$(date +%Y%m%d)
          NAME="${DATE}_${SAFE}.mp4"
          mv work/output.mp4 "$NAME"
          gh release create "auto-${DATE}-${VIDEO_ID}" "$NAME" work/zh.srt \
            --title "$TITLE" --notes "自动处理：notube 下载 + downsub/翻译字幕烧录" || true
          if [ -n "$SERVERCHAN_KEY" ]; then
            REL_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/auto-${DATE}-${VIDEO_ID}"
            curl -s "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send" \
              -d "title=新视频处理完成" \
              -d "desp=${TITLE}%0A%0A[下载链接](${REL_URL})" || true
          fi
