name: Update LLM Secrets
on:
  workflow_dispatch:
    inputs:
      api_key:
        description: 'LLM API Key'
        required: true
      base_url:
        description: 'LLM Base URL'
        required: true
        default: 'https://open.bigmodel.cn/api/paas/v4'
      model:
        description: 'LLM Model'
        required: true
        default: 'glm-4-flash'
permissions:
  secrets: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set LLM secrets
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY_VAL: ${{ github.event.inputs.api_key }}
          LLM_BASE_URL_VAL: ${{ github.event.inputs.base_url }}
          LLM_MODEL_VAL: ${{ github.event.inputs.model }}
        run: |
          gh secret set LLM_API_KEY --body "$LLM_API_KEY_VAL"
          gh secret set LLM_BASE_URL --body "$LLM_BASE_URL_VAL"
          gh secret set LLM_MODEL --body "$LLM_MODEL_VAL"
          echo "Secrets updated successfully"
