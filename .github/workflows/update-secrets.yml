name: Update LLM Secrets
on: workflow_dispatch
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set LLM secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh secret set LLM_API_KEY --body "fb0960e3d7af4e0480726ee4c0eabf80.Cg3uH4Gx0hOVSU4I"
          gh secret set LLM_BASE_URL --body "https://open.bigmodel.cn/api/paas/v4"
          gh secret set LLM_MODEL --body "glm-4-flash"
          echo "Secrets updated successfully"
