name: Probe V8 Notube
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'YouTube video ID'
        required: false
        default: 'KUf0x6FG7p0'

jobs:
  notube:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install playwright
        run: |
          npm install playwright@1.57.0 --no-save
          npx playwright install chromium --with-deps
      - name: Run notube probe v8
        env:
          VID: ${{ inputs.video_id }}
          OUTDIR: out
        run: node scripts/probe_v8_notube.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v8-notube-results
          path: |
            out/v8_*
          if-no-files-found: warn
