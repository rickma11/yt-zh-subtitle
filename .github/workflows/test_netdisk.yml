name: Test 国内网盘上传（隔离测试，不走视频流水线）

on:
  workflow_dispatch:
    inputs:
      providers:
        description: "要测的网盘（逗号分隔: quark,baidu,aliyun），留空=全部"
        required: false
        default: "quark,baidu,aliyun"

jobs:
  test-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 生成 1KB 测试文件（不下载/不合成视频）
        run: printf 'netdisk upload test %s\n' "$(date)" > /tmp/netdisk_test.txt && wc -c /tmp/netdisk_test.txt

      - name: 测试 夸克网盘
        if: ${{ contains(inputs.providers, 'quark') }}
        continue-on-error: true
        env:
          QUARK_COOKIE: ${{ secrets.QUARK_COOKIE }}
        run: |
          if [ -z "$QUARK_COOKIE" ]; then echo "跳过：未配置 QUARK_COOKIE"; exit 0; fi
          echo "=== 夸克网盘 上传测试 ==="
          python scripts/netdisk_upload.py quark /tmp/netdisk_test.txt

      - name: 测试 百度网盘
        if: ${{ contains(inputs.providers, 'baidu') }}
        continue-on-error: true
        env:
          BAIDU_BDUSS: ${{ secrets.BAIDU_BDUSS }}
        run: |
          if [ -z "$BAIDU_BDUSS" ]; then echo "跳过：未配置 BAIDU_BDUSS"; exit 0; fi
          echo "=== 百度网盘 上传测试 ==="
          python scripts/netdisk_upload.py baidu /tmp/netdisk_test.txt

      - name: 测试 阿里云盘
        if: ${{ contains(inputs.providers, 'aliyun') }}
        continue-on-error: true
        env:
          ALIYUN_REFRESH_TOKEN: ${{ secrets.ALIYUN_REFRESH_TOKEN }}
        run: |
          if [ -z "$ALIYUN_REFRESH_TOKEN" ]; then echo "跳过：未配置 ALIYUN_REFRESH_TOKEN"; exit 0; fi
          echo "=== 阿里云盘 上传测试 ==="
          python scripts/netdisk_upload.py aliyun /tmp/netdisk_test.txt
