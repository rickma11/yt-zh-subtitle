name: Probe V7 Notube

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'YouTube video ID for probe'
        default: 'KUf0x6FG7p0'

permissions:
  contents: read

jobs:
  notube:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright + Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run notube probe
        env:
          VID: ${{ inputs.video_id }}
        run: node scripts/probe_v7_notube.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v7-notube-results
          path: |
            v7_*
          if-no-files-found: warn
